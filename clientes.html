<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Clientes y Deuda - ERP Distribución</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-6xl mx-auto space-y-6 px-4 pt-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl text-xl"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">Clientes Activos</p>
          <h3 id="cardTotalClientes" class="text-xl font-extrabold text-slate-800">0</h3>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-xl text-xl"><i class="fa-solid fa-scale-unbalanced"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">Deuda Total de Clientes</p>
          <h3 id="cardDeudaTotal" class="text-xl font-extrabold text-amber-600">0.00 €</h3>
        </div>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
        <div class="p-3 bg-rose-50 text-rose-600 rounded-xl text-xl"><i class="fa-solid fa-user-xmark"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">Riesgo Excedido</p>
          <h3 id="cardRiesgoExcedido" class="text-xl font-extrabold text-rose-600">0 Clientes</h3>
        </div>
      </div>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center gap-4">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="inputBuscarCliente" onkeyup="filtrarClientes()" placeholder="Buscar cliente, CIF o dirección..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
      </div>

      <button onclick="abrirModalCliente()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Nuevo Cliente
      </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-xs text-slate-500 uppercase border-b">
            <tr>
              <th class="p-3">Nombre Comercial</th>
              <th class="p-3">CIF / NIF</th>
              <th class="p-3">Contacto</th>
              <th class="p-3 text-right">Deuda Pendiente</th>
              <th class="p-3 text-right">Límite Riesgo</th>
              <th class="p-3 text-center">Estado Riesgo</th>
              <th class="p-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaClientes" class="divide-y divide-slate-100">
            <tr><td colspan="7" class="p-6 text-center text-slate-400">Cargando lista de clientes...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="modalCliente" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalClienteTitulo" class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-blue-600"></i> Registrar Nuevo Cliente
        </h3>
        <button onclick="cerrarModalCliente()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <input type="hidden" id="cliId">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Comercial / Razón Social *</label>
          <input type="text" id="cliNombre" placeholder="Ej: Restaurante El Mar S.L." class="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-semibold">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">CIF / NIF</label>
            <input type="text" id="cliCif" placeholder="B98765432" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Teléfono</label>
            <input type="text" id="cliTel" placeholder="952 00 00 00" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Facturación</label>
          <input type="email" id="cliEmail" placeholder="facturacion@restaurante.com" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Dirección de Entrega</label>
          <input type="text" id="cliDir" placeholder="Paseo Marítimo 12, Málaga" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Límite de Riesgo Máximo (€)</label>
          <input type="number" id="cliRiesgo" value="1000" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-bold text-slate-800">
        </div>
      </div>

      <div class="flex justify-end gap-2 border-t pt-4">
        <button onclick="cerrarModalCliente()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200">Cancelar</button>
        <button onclick="guardarCliente()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow">
          💾 Guardar Cliente
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let clientesTodos = [];
    let facturasPendientes = [];

    window.onload = async () => {
      await cargarDatos();
    };

    async function cargarDatos() {
      const empresaId = getEmpresaIdActivo();

      let qFacturas = dbClient.from('facturas').select('*').neq('estado_cobro', 'cobrada');
      if (empresaId) qFacturas = qFacturas.eq('empresa_id', empresaId);
      const { data: facturas } = await qFacturas;
      facturasPendientes = facturas || [];

      let qClientes = dbClient.from('clientes').select('*');
      if (empresaId) qClientes = qClientes.eq('empresa_id', empresaId);
      const { data: clientes, error } = await qClientes.order('nombre_comercial');
      
      if (error) return alert("Error al cargar clientes.");

      clientesTodos = clientes || [];

      clientesTodos.forEach(c => {
        c._deudaCalculada = facturasPendientes
          .filter(f => String(f.cliente_id) === String(c.id))
          .reduce((sum, f) => sum + parseFloat(f.total_factura || f.total || 0), 0);
      });

      actualizarCards();
      renderizarTabla(clientesTodos);
    }

    function renderizarTabla(lista) {
      const tbody = document.getElementById('tablaClientes');
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">No hay clientes registrados en esta empresa.</td></tr>';
        return;
      }

      tbody.innerHTML = lista.map(c => {
        const deuda = c._deudaCalculada || 0;
        const limite = parseFloat(c.limite_credito || 1000);
        const excedido = deuda > limite;
        const nom = c.nombre_comercial || c.nombre || c.razon_social || `Cliente #${c.id}`;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-bold text-slate-900">${nom}</td>
            <td class="p-3 font-mono text-slate-600">${c.cif_nif || c.cif || 'S/N'}</td>
            <td class="p-3 text-xs text-slate-500">
              <div>${c.telefono || '-'}</div>
              <div class="text-blue-600 font-mono">${c.email || ''}</div>
            </td>
            <td class="p-3 text-right font-bold ${deuda > 0 ? 'text-amber-600' : 'text-emerald-600'}">${deuda.toFixed(2)} €</td>
            <td class="p-3 text-right text-slate-700">${limite.toFixed(2)} €</td>
            <td class="p-3 text-center">
              <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border uppercase ${
                excedido 
                  ? 'bg-rose-50 text-rose-700 border-rose-200' 
                  : 'bg-emerald-50 text-emerald-700 border-emerald-200'
              }">
                ${excedido ? 'Riesgo Superado' : 'Correcto'}
              </span>
            </td>
            <td class="p-3 text-center">
              <button onclick="editarCliente('${c.id}')" class="px-3 py-1 bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-600 rounded-lg text-xs font-bold transition border border-slate-200">
                <i class="fa-solid fa-pen-to-square"></i> Editar
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function actualizarCards() {
      const totalClientes = clientesTodos.length;
      const deudaTotal = clientesTodos.reduce((sum, c) => sum + (c._deudaCalculada || 0), 0);
      const riesgoExcedidoCount = clientesTodos.filter(c => (c._deudaCalculada || 0) > parseFloat(c.limite_credito || 1000)).length;

      document.getElementById('cardTotalClientes').innerText = totalClientes;
      document.getElementById('cardDeudaTotal').innerText = `${deudaTotal.toFixed(2)} €`;
      document.getElementById('cardRiesgoExcedido').innerText = `${riesgoExcedidoCount} Clientes`;
    }

    function filtrarClientes() {
      const q = document.getElementById('inputBuscarCliente').value.toLowerCase();
      const filtrados = clientesTodos.filter(c => {
        const nom = (c.nombre_comercial || c.nombre || '').toLowerCase();
        const cif = (c.cif_nif || c.cif || '').toLowerCase();
        return nom.includes(q) || cif.includes(q);
      });
      renderizarTabla(filtrados);
    }

    function abrirModalCliente() {
      document.getElementById('cliId').value = "";
      document.getElementById('cliNombre').value = "";
      document.getElementById('cliCif').value = "";
      document.getElementById('cliTel').value = "";
      document.getElementById('cliEmail').value = "";
      document.getElementById('cliDir').value = "";
      document.getElementById('cliRiesgo').value = "1000";
      document.getElementById('modalClienteTitulo').innerHTML = '<i class="fa-solid fa-user-plus text-blue-600"></i> Registrar Nuevo Cliente';

      document.getElementById('modalCliente').classList.remove('hidden');
      document.getElementById('modalCliente').classList.add('flex');
    }

    function cerrarModalCliente() {
      document.getElementById('modalCliente').classList.add('hidden');
      document.getElementById('modalCliente').classList.remove('flex');
    }

    function editarCliente(id) {
      const c = clientesTodos.find(item => String(item.id) === String(id));
      if (!c) return;

      document.getElementById('cliId').value = c.id;
      document.getElementById('cliNombre').value = c.nombre_comercial || c.nombre || "";
      document.getElementById('cliCif').value = c.cif_nif || c.cif || "";
      document.getElementById('cliTel').value = c.telefono || "";
      document.getElementById('cliEmail').value = c.email || "";
      document.getElementById('cliDir').value = c.direccion || "";
      document.getElementById('cliRiesgo').value = c.limite_credito || 1000;
      document.getElementById('modalClienteTitulo').innerHTML = '<i class="fa-solid fa-pen-to-square text-blue-600"></i> Editar Ficha de Cliente';

      document.getElementById('modalCliente').classList.remove('hidden');
      document.getElementById('modalCliente').classList.add('flex');
    }

    async function guardarCliente() {
      const id = document.getElementById('cliId').value;
      const nombre = document.getElementById('cliNombre').value.trim();
      const cif = document.getElementById('cliCif').value.trim();
      const tel = document.getElementById('cliTel').value.trim();
      const email = document.getElementById('cliEmail').value.trim();
      const dir = document.getElementById('cliDir').value.trim();
      const riesgo = parseFloat(document.getElementById('cliRiesgo').value) || 1000;
      const empresaId = getEmpresaIdActivo();

      if (!nombre) return alert("El nombre comercial es obligatorio.");

      if (id) {
        const { error } = await dbClient.from('clientes').update({
          nombre_comercial: nombre,
          cif_nif: cif,
          telefono: tel,
          email: email,
          direccion: dir,
          limite_credito: riesgo
        }).eq('id', id);

        if (error) return alert("Error al actualizar: " + error.message);
      } else {
        const { error } = await dbClient.from('clientes').insert([{
          empresa_id: empresaId,
          nombre_comercial: nombre,
          cif_nif: cif,
          telefono: tel,
          email: email,
          direccion: dir,
          limite_credito: riesgo
        }]);

        if (error) return alert("Error al crear cliente: " + error.message);
      }

      cerrarModalCliente();
      await cargarDatos();
    }
  </script>
</body>
</html>
