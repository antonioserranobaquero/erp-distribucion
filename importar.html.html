<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importador CSV - ERP Albaranes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 30px; color: #334155; }
    .container { max-width: 750px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #0f172a; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #64748b; }
    select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { background: #1d4ed8; }
    #log { margin-top: 20px; background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>📥 Importación Masiva de Datos (CSV)</h2>
      
      <label>1. Selecciona la Empresa Propietaria:</label>
      <select id="empresa_select">
        <option value="">Cargando empresas...</option>
      </select>

      <label>2. Selecciona tu archivo CSV (`Clientes_Precios_Ventomar.csv`):</label>
      <input type="file" id="csv_file" accept=".csv">

      <button onclick="procesarCSV()">⚡ Procesar e Importar a Supabase</button>

      <div id="log"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5YnpsdHd4cHdlemF3Zm5rbGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjcxMjYsImV4cCI6MjEwMDMwMzEyNn0.Ib17m5wofSx8Z0PCUT2Q_Orx5OTtGyW7W9_EoJupmgY";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async () => {
      const select = document.getElementById('empresa_select');
      const { data } = await db.from('empresas').select('id, nombre');
      if (data && data.length) {
        select.innerHTML = data.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('');
      }
    };

    function logMessage(msg, esError = false) {
      const logDiv = document.getElementById('log');
      logDiv.style.display = 'block';
      const color = esError ? '#f87171' : '#38bdf8';
      logDiv.innerHTML += `<span style="color:${color}">> ${msg}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function procesarCSV() {
      const empresa_id = document.getElementById('empresa_select').value;
      const fileInput = document.getElementById('csv_file');
      
      if (!empresa_id || !fileInput.files.length) {
        alert("Selecciona la empresa y el archivo CSV.");
        return;
      }

      document.getElementById('log').innerHTML = '';
      logMessage("Leyendo archivo CSV...");

      Papa.parse(fileInput.files[0], {
        header: true,
        delimiter: ";",
        skipEmptyLines: true,
        complete: async function(results) {
          if (!results.data.length) {
            logMessage("⚠️ El archivo CSV parece estar vacío.", true);
            return;
          }

          // Mostrar las columnas detectadas
          const columnas = Object.keys(results.data[0]);
          logMessage(`Columnas detectadas en el CSV: [ ${columnas.join(', ')} ]`);
          logMessage(`Filas a procesar: ${results.data.length}`);
          
          await importarDatos(results.data, empresa_id, columnas);
        }
      });
    }

    async function importarDatos(filas, empresa_id, columnas) {
      logMessage("Iniciando volcado a Supabase...");

      const clientesMap = new Map();
      const productosMap = new Map();

      let contClientesNuevos = 0;
      let contProductosNuevos = 0;
      let contTarifasGuardadas = 0;

      // Buscar nombres de columnas de forma flexible
      const colCliente = columnas.find(c => /cliente/i.test(c)) || columnas[0];
      const colProducto = columnas.find(c => /prod|articulo|descripcion/i.test(c)) || columnas[1];
      const colPrecio = columnas.find(c => /prec|tarif|pvp|kilo/i.test(c)) || columnas[2];

      logMessage(`Usando columna Cliente: "${colCliente}"`);
      logMessage(`Usando columna Producto: "${colProducto}"`);
      logMessage(`Usando columna Precio: "${colPrecio}"`);

      for (let i = 0; i < filas.length; i++) {
        const row = filas[i];
        const nombreCliente = (row[colCliente] || '').trim();
        const nombreProducto = (row[colProducto] || '').trim();
        const precioRaw = (row[colPrecio] || '').toString().trim();
        const precio = parseFloat(precioRaw.replace(',', '.')) || 0;

        if (!nombreCliente || !nombreProducto) continue;

        // 1. Gestionar Cliente
        let clienteId = clientesMap.get(nombreCliente);
        if (!clienteId) {
          let { data: cli } = await db.from('clientes').select('id').eq('empresa_id', empresa_id).eq('nombre_comercial', nombreCliente).maybeSingle();
          if (!cli) {
            const { data: newCli, error: errC } = await db.from('clientes').insert([{ empresa_id, nombre_comercial: nombreCliente }]).select().single();
            if (errC) logMessage(`Error al crear cliente "${nombreCliente}": ${errC.message}`, true);
            if (newCli) {
              cli = newCli;
              contClientesNuevos++;
            }
          }
          if (cli) {
            clienteId = cli.id;
            clientesMap.set(nombreCliente, clienteId);
          }
        }

        // 2. Gestionar Producto
        let productoId = productosMap.get(nombreProducto);
        if (!productoId) {
          let { data: prod } = await db.from('productos').select('id').eq('empresa_id', empresa_id).eq('nombre', nombreProducto).maybeSingle();
          if (!prod) {
            const { data: newProd, error: errP } = await db.from('productos').insert([{ 
              empresa_id, 
              nombre: nombreProducto, 
              precio_base: precio, 
              tipo_venta: 'kilo' 
            }]).select().single();
            if (errP) logMessage(`Error al crear producto "${nombreProducto}": ${errP.message}`, true);
            if (newProd) {
              prod = newProd;
              contProductosNuevos++;
            }
          }
          if (prod) {
            productoId = prod.id;
            productosMap.set(nombreProducto, productoId);
          }
        }

        // 3. Crear Tarifa Especial
        if (clienteId && productoId) {
          const { error: errT } = await db.from('tarifas_clientes').insert([{
            empresa_id,
            cliente_id: clienteId,
            producto_id: productoId,
            precio_especial: precio
          }]);
          
          if (errT) {
            if (i === 0) logMessage(`Error al insertar tarifa: ${errT.message} (¿Desactivaste RLS en tarifas_clientes?)`, true);
          } else {
            contTarifasGuardadas++;
          }
        }
      }

      logMessage(`----------------------------------------`);
      logMessage(`✨ Clientes NUEVOS creados: ${contClientesNuevos}`);
      logMessage(`📦 Productos NUEVOS creados: ${contProductosNuevos}`);
      logMessage(`⭐ Tarifas de cliente guardadas: ${contTarifasGuardadas}`);
      logMessage("✅ ¡PROCESO DE IMPORTACIÓN COMPLETADO!");
    }
  </script>
</body>
</html>
