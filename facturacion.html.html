<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Facturación - ERP Distribución</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-6xl mx-auto space-y-6 px-4 pt-4">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-extrabold text-slate-800 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-filter text-blue-600"></i> 1. Filtros de Albaranes Pendientes
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div class="relative">
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Cliente (Opcional)</label>
          <input type="text" id="clienteInput" placeholder="🔍 Todos los clientes..." oninput="filtrarClientesPredictivo()" onfocus="filtrarClientesPredictivo()" autocomplete="off" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-2.5 text-xs font-bold focus:ring-blue-500 focus:border-blue-500">
          <input type="hidden" id="clienteIdHidden">
          <div id="clienteResults" class="hidden absolute z-50 w-full bg-white border border-slate-300 rounded-xl shadow-lg max-h-60 overflow-y-auto mt-1"></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Desde</label>
          <input type="date" id="fechaDesdeInput" onchange="cargarAlbaranesPendientes()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-2.5 text-xs font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Hasta</label>
          <input type="date" id="fechaHastaInput" onchange="cargarAlbaranesPendientes()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl p-2.5 text-xs font-semibold">
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
        <span class="text-xs font-bold text-slate-400 uppercase mr-2">Rangos rápidos:</span>
        <button type="button" onclick="setRangoRapido('hoy')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 font-bold rounded-xl text-xs transition border border-slate-200">📅 Hoy</button>
        <button type="button" onclick="setRangoRapido('semana')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 font-bold rounded-xl text-xs transition border border-slate-200">🗓️ Esta Semana</button>
        <button type="button" onclick="setRangoRapido('mes')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 font-bold rounded-xl text-xs transition border border-slate-200">📆 Este Mes</button>
        <button type="button" onclick="limpiarFiltros()" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-500 font-bold rounded-xl text-xs transition ml-auto">🔄 Ver Todo</button>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-base font-extrabold text-slate-800">2. Albaranes Pendientes de Facturar</h2>
        <span id="contadorSeleccionados" class="text-xs bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full">0 Seleccionados</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-slate-600">
          <thead class="text-xs text-slate-500 uppercase bg-slate-100 border-b">
            <tr>
              <th class="py-3 px-4 w-10 text-center">
                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="w-4 h-4 text-blue-600 rounded">
              </th>
              <th class="py-3 px-4">Nº Albarán</th>
              <th class="py-3 px-4">Cliente</th>
              <th class="py-3 px-4">Fecha</th>
              <th class="py-3 px-4 text-center">Cajas / Kilos</th>
              <th class="py-3 px-4 text-right">Total (€)</th>
            </tr>
          </thead>
          <tbody id="tablaPendientesBody" class="divide-y divide-slate-100">
            <tr><td colspan="6" class="text-center py-8 text-slate-400">Cargando albaranes pendientes...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="flex flex-col md:flex-row justify-between items-center pt-4 border-t gap-4">
        <div class="text-xs text-slate-700 space-y-1">
          <div>Base Imponible Total: <strong id="baseImponibleSpan" class="text-slate-900 font-mono">0.00 €</strong></div>
          <div>IVA (10%): <strong id="ivaSpan" class="text-slate-900 font-mono">0.00 €</strong></div>
          <div class="text-base font-extrabold text-blue-900">TOTAL FACTURAS: <span id="totalFacturaSpan" class="text-xl font-black">0.00 €</span></div>
        </div>

        <button type="button" onclick="emitirFacturasSeleccionadas()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-md transition text-xs flex items-center justify-center gap-2">
          🧾 Facturar Albaranes Seleccionados
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let clientesCache = [];
    let albaranesPendientes = [];
    let seleccionadosSet = new Set();

    document.addEventListener('DOMContentLoaded', () => {
      cargarClientes();
      cargarAlbaranesPendientes();

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#clienteInput') && !e.target.closest('#clienteResults')) {
          document.getElementById('clienteResults').classList.add('hidden');
        }
      });
    });

    function extraerNombreCliente(c) {
      return c.nombre_comercial || c.nombre || c.razon_social || `Cliente #${c.id}`;
    }

    async function cargarClientes() {
      const empresaId = getEmpresaIdActivo();
      let query = db.from('clientes').select('*');
      if (empresaId) query = query.eq('empresa_id', empresaId);

      const { data } = await query;
      if (data) clientesCache = data;
    }

    function filtrarClientesPredictivo() {
      const query = document.getElementById('clienteInput').value.toLowerCase().trim();
      const resultsDiv = document.getElementById('clienteResults');
      resultsDiv.innerHTML = '';

      const filtrados = clientesCache.filter(c => extraerNombreCliente(c).toLowerCase().includes(query));

      if (filtrados.length === 0) {
        resultsDiv.innerHTML = '<div class="p-3 text-xs text-slate-400">Sin resultados</div>';
      } else {
        filtrados.forEach(c => {
          const nombre = extraerNombreCliente(c);
          const item = document.createElement('div');
          item.className = 'p-2.5 hover:bg-blue-50 cursor-pointer text-xs font-bold text-slate-800 border-b border-slate-100';
          item.innerText = nombre;
          item.onclick = () => {
            document.getElementById('clienteInput').value = nombre;
            document.getElementById('clienteIdHidden').value = c.id;
            resultsDiv.classList.add('hidden');
            cargarAlbaranesPendientes();
          };
          resultsDiv.appendChild(item);
        });
      }
      resultsDiv.classList.remove('hidden');
    }

    function limpiarFiltros() {
      document.getElementById('clienteInput').value = '';
      document.getElementById('clienteIdHidden').value = '';
      document.getElementById('fechaDesdeInput').value = '';
      document.getElementById('fechaHastaInput').value = '';
      cargarAlbaranesPendientes();
    }

    function setRangoRapido(tipo) {
      const hoy = new Date();
      let desde = new Date();
      let hasta = new Date();

      if (tipo === 'hoy') {
        desde = hoy; hasta = hoy;
      } else if (tipo === 'semana') {
        const day = hoy.getDay();
        const diff = hoy.getDate() - day + (day === 0 ? -6 : 1);
        desde = new Date(hoy.setDate(diff));
        hasta = new Date();
      } else if (tipo === 'mes') {
        desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        hasta = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
      }

      document.getElementById('fechaDesdeInput').value = desde.toISOString().split('T')[0];
      document.getElementById('fechaHastaInput').value = hasta.toISOString().split('T')[0];
      cargarAlbaranesPendientes();
    }

    async function cargarAlbaranesPendientes() {
      const empresaId = getEmpresaIdActivo();
      const clienteId = document.getElementById('clienteIdHidden').value;
      const fechaDesde = document.getElementById('fechaDesdeInput').value;
      const fechaHasta = document.getElementById('fechaHastaInput').value;

      let query = db.from('albaranes').select('*').eq('estado', 'pendiente');
      if (empresaId) query = query.eq('empresa_id', empresaId);
      if (clienteId) query = query.eq('cliente_id', clienteId);

      const { data: albaranes, error } = await query;

      let qCli = db.from('clientes').select('*');
      if (empresaId) qCli = qCli.eq('empresa_id', empresaId);
      const { data: clientes } = await qCli;

      let qLin = db.from('lineas_albaran').select('*');
      if (empresaId) qLin = qLin.eq('empresa_id', empresaId);
      const { data: lineas } = await qLin;

      if (error || !albaranes) {
        document.getElementById('tablaPendientesBody').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-rose-500 font-bold">Error cargando albaranes pendientes.</td></tr>';
        return;
      }

      albaranesPendientes = albaranes.map(a => {
        const cli = clientes ? clientes.find(c => String(c.id) === String(a.cliente_id)) : null;
        const nombreCliente = cli ? extraerNombreCliente(cli) : 'Cliente Desconocido';
        const fecha = a.fecha_salida || a.fecha || a.created_at || '2026-01-01';
        const fechaCorta = fecha.split('T')[0];

        const misLineas = lineas ? lineas.filter(l => String(l.albaran_id || l.id_albaran) === String(a.id)) : [];

        let tCajas = Number(a.total_cajas) || 0;
        let tKilos = Number(a.total_kilos) || 0;
        let tImporte = Number(a.total_importe || a.total) || 0;

        if (misLineas.length > 0) {
          if (tCajas === 0) tCajas = misLineas.reduce((acc, l) => acc + (Number(l.cajas) || 0), 0);
          if (tKilos === 0) tKilos = misLineas.reduce((acc, l) => acc + (Number(l.kilos) || 0), 0);
          if (tImporte === 0) {
            tImporte = misLineas.reduce((acc, l) => acc + Number(l.subtotal || l.importe || ((Number(l.kilos)||0) * (Number(l.precio_kg||l.precio)||0))), 0);
          }
        }

        return {
          ...a,
          cliente_nombre: nombreCliente,
          cajasNum: tCajas,
          kilosNum: tKilos,
          importeNum: tImporte,
          fechaStr: fechaCorta
        };
      });

      if (fechaDesde) albaranesPendientes = albaranesPendientes.filter(a => a.fechaStr >= fechaDesde);
      if (fechaHasta) albaranesPendientes = albaranesPendientes.filter(a => a.fechaStr <= fechaHasta);

      seleccionadosSet.clear();
      document.getElementById('selectAllCheckbox').checked = false;
      renderizarTablaPendientes();
    }

    function renderizarTablaPendientes() {
      const tbody = document.getElementById('tablaPendientesBody');
      tbody.innerHTML = '';

      if (albaranesPendientes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-400">No hay albaranes pendientes para esta empresa.</td></tr>';
        actualizarTotalesSeleccion();
        return;
      }

      albaranesPendientes.forEach(a => {
        const checked = seleccionadosSet.has(a.id) ? 'checked' : '';
        tbody.innerHTML += `
          <tr class="border-b bg-white hover:bg-slate-50 transition">
            <td class="py-3 px-4 text-center">
              <input type="checkbox" onchange="toggleSeleccion('${a.id}')" ${checked} class="chk-albaran w-4 h-4 text-blue-600 rounded">
            </td>
            <td class="py-3 px-4 font-mono font-bold text-blue-900">${a.numero_albaran || 'ALB-000'}</td>
            <td class="py-3 px-4 font-bold text-slate-800">${a.cliente_nombre}</td>
            <td class="py-3 px-4 text-xs font-mono text-slate-500">${a.fechaStr}</td>
            <td class="py-3 px-4 text-center font-semibold text-slate-700">${a.cajasNum} caj. / ${a.kilosNum.toFixed(2)} kg</td>
            <td class="py-3 px-4 text-right font-bold text-emerald-700">${a.importeNum.toFixed(2)} €</td>
          </tr>`;
      });

      actualizarTotalesSeleccion();
    }

    function toggleSeleccion(id) {
      if (seleccionadosSet.has(id)) seleccionadosSet.delete(id);
      else seleccionadosSet.add(id);
      actualizarTotalesSeleccion();
    }

    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAllCheckbox').checked;
      if (selectAll) albaranesPendientes.forEach(a => seleccionadosSet.add(a.id));
      else seleccionadosSet.clear();
      renderizarTablaPendientes();
    }

    function actualizarTotalesSeleccion() {
      let baseTotal = 0;
      seleccionadosSet.forEach(id => {
        const alb = albaranesPendientes.find(a => String(a.id) === String(id));
        if (alb) baseTotal += alb.importeNum;
      });

      const iva = baseTotal * 0.10;
      const total = baseTotal + iva;

      document.getElementById('baseImponibleSpan').innerText = baseTotal.toFixed(2) + ' €';
      document.getElementById('ivaSpan').innerText = iva.toFixed(2) + ' €';
      document.getElementById('totalFacturaSpan').innerText = total.toFixed(2) + ' €';
      document.getElementById('contadorSeleccionados').innerText = `${seleccionadosSet.size} Seleccionados`;
    }

    async function emitirFacturasSeleccionadas() {
      if (seleccionadosSet.size === 0) {
        alert("⚠️ Selecciona al menos un albarán para facturar.");
        return;
      }

      const albaranesElegidos = albaranesPendientes.filter(a => seleccionadosSet.has(a.id));

      const porCliente = {};
      albaranesElegidos.forEach(a => {
        if (!porCliente[a.cliente_id]) porCliente[a.cliente_id] = [];
        porCliente[a.cliente_id].push(a);
      });

      const numClientes = Object.keys(porCliente).length;
      if (!confirm(`¿Deseas generar facturas para ${seleccionadosSet.size} albarán(es) repartidos en ${numClientes} cliente(s)?`)) return;

      let creadasCount = 0;

      for (const clienteId in porCliente) {
        const listaAlb = porCliente[clienteId];
        const ids = listaAlb.map(a => a.id);
        const { error } = await db.from('albaranes').update({ estado: 'facturado' }).in('id', ids);

        if (!error) creadasCount++;
      }

      alert(`✅ ¡Proceso completado! Se han generado ${creadasCount} factura(s) individuales y sus albaranes se han marcado como facturados.`);
      cargarAlbaranesPendientes();
    }
  </script>
</body>
</html>
