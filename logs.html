<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Auditoría - ERP Distribución</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-7xl mx-auto space-y-6 px-4 pt-4">

    <!-- CABECERA -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-blue-600"></i> Registro de Auditoría y Trazabilidad de Cambios
        </h1>
        <p class="text-xs text-slate-500 mt-1">Historial inalterable de acciones de usuarios, modificaciones de albarán, stock y facturas</p>
      </div>

      <button onclick="cargarLogsAuditoria()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition border border-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-rotate mr-1"></i> Actualizar Logs
      </button>
    </div>

    <!-- BÚSQUEDA Y FILTROS -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="inputBuscarLog" onkeyup="filtrarLogs()" placeholder="Buscar por email, acción o detalles..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex gap-2 w-full md:w-auto">
        <select id="filtroAccion" onchange="filtrarLogs()" class="p-2 border border-slate-300 rounded-xl text-xs font-bold text-slate-700 bg-slate-50">
          <option value="TODOS">Todas las Acciones</option>
          <option value="MODIFICACION_RUTA">✏️ Modificación en Ruta [*]</option>
          <option value="AJUSTE_STOCK">📦 Ajuste de Stock / Almacén</option>
          <option value="FACTURACION">📄 Emitir Factura / Rectificativa</option>
          <option value="LOGIN">🔒 Inicio de Sesión</option>
        </select>
      </div>
    </div>

    <!-- TABLA DE LOGS DE AUDITORÍA -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-xs text-slate-500 uppercase border-b">
            <tr>
              <th class="p-3">Fecha y Hora</th>
              <th class="p-3">Usuario / Empleado</th>
              <th class="p-3">Acción Registrada</th>
              <th class="p-3">Módulo / Tabla</th>
              <th class="p-3">Detalle / Motivo de Cambio</th>
            </tr>
          </thead>
          <tbody id="tablaLogsBody" class="divide-y divide-slate-100 font-mono text-xs">
            <tr><td colspan="5" class="p-6 text-center text-slate-400">Cargando registros de auditoría...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let logsCache = [];

    window.onload = () => {
      cargarLogsAuditoria();
    };

    async function cargarLogsAuditoria() {
      const empresaId = getEmpresaIdActivo();
      const tbody = document.getElementById('tablaLogsBody');
      
      let query = dbClient.from('logs_auditoria').select('*');
      if (empresaId) query = query.eq('empresa_id', empresaId);

      const { data: logs, error } = await query.order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">Si es la primera vez, crea la tabla "logs_auditoria" en Supabase.</td></tr>';
        return;
      }

      logsCache = logs || [];

      if (logsCache.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">No hay registros de auditoría para esta empresa.</td></tr>';
        return;
      }

      renderizarTabla(logsCache);
    }

    function renderizarTabla(lista) {
      const tbody = document.getElementById('tablaLogsBody');

      tbody.innerHTML = lista.map(l => {
        const fechaHora = l.created_at ? l.created_at.replace('T', ' ').substring(0, 19) : '-';
        
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-bold text-slate-700 whitespace-nowrap">${fechaHora}</td>
            <td class="p-3 font-semibold text-blue-900">${l.usuario_email || l.usuario || 'Sistema'}</td>
            <td class="p-3"><span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">${l.accion || 'ACCION'}</span></td>
            <td class="p-3 font-bold text-slate-600">${l.tabla_afectada || l.modulo || 'GENERAL'}</td>
            <td class="p-3 text-slate-800 font-sans">${l.detalles || l.motivo || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function filtrarLogs() {
      const q = document.getElementById('inputBuscarLog').value.toLowerCase();
      const accion = document.getElementById('filtroAccion').value;

      const filtrados = logsCache.filter(l => {
        const txt = ( (l.usuario_email || '') + ' ' + (l.accion || '') + ' ' + (l.detalles || '') ).toLowerCase();
        const coincideQ = txt.includes(q);

        let coincideAccion = true;
        if (accion !== 'TODOS') {
          coincideAccion = l.accion === accion;
        }

        return coincideQ && coincideAccion;
      });

      renderizarTabla(filtrados);
    }
  </script>
</body>
</html>
