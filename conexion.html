  <script>
    // Tus credenciales reales configuradas:
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5YnpsdHd4cHdlemF3Zm5rbGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjcxMjYsImV4cCI6MjEwMDMwMzEyNn0.Ib17m5wofSx8Z0PCUT2Q_Orx5OTtGyW7W9_EoJupmgY";

    // Conexión con Supabase
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function guardarEmpresa() {
      const status = document.getElementById('status');
      status.style.color = '#1e293b';
      status.innerText = "⏳ Guardando datos en la nube...";

      const nombre = document.getElementById('nombre').value;
      const cif = document.getElementById('cif').value;
      const ultimo_albaran = parseInt(document.getElementById('ultimo_albaran').value) || 0;
      const ultima_factura = parseInt(document.getElementById('ultima_factura').value) || 0;

      if (!nombre) {
        status.style.color = '#dc2626';
        status.innerText = "⚠️ Escribe al menos el nombre de la empresa.";
        return;
      }

      // Insertar en la tabla 'empresas'
      const { data, error } = await db
        .from('empresas')
        .insert([
          { 
            nombre: nombre, 
            cif: cif, 
            ultimo_albaran: ultimo_albaran, 
            ultima_factura: ultima_factura 
          }
        ]);

      if (error) {
        console.error(error);
        status.style.color = '#dc2626';
        status.innerText = "❌ Error: " + error.message;
      } else {
        status.style.color = '#16a34a';
        status.innerText = "✅ ¡Empresa guardada con éxito en Supabase!";
        
        // Limpiar campos
        document.getElementById('nombre').value = '';
        document.getElementById('cif').value = '';
      }
    }
  </script>
