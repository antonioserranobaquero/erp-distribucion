  <!-- CONTENIDO PRINCIPAL -->
  <div class="max-w-xl mx-auto px-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
      
      <div class="text-center space-y-1">
        <h2 class="text-xl font-extrabold text-slate-800">🔌 Configuración de Empresa</h2>
        <p class="text-xs text-slate-500">Parámetros corporativos, numeración de serie e identidad fiscal.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Comercial de la Empresa</label>
          <input type="text" id="nombre" placeholder="Distribuciones Congelados S.L." class="w-full p-3 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">CIF / NIF</label>
          <input type="text" id="cif" placeholder="B-12345678" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Último Albarán</label>
            <input type="number" id="ultimo_albaran" value="0" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Última Factura</label>
            <input type="number" id="ultima_factura" value="0" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-semibold">
          </div>
        </div>

        <button onclick="guardarEmpresa()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Guardar Cambios en Supabase
        </button>

        <div id="status" class="text-center font-bold text-sm pt-2"></div>
      </div>

    </div>
  </div>

  <!-- SCRIPT LÓGICA SUPABASE -->
  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function guardarEmpresa() {
      const status = document.getElementById('status');
      status.style.color = '#1e293b';
      status.innerText = "⏳ Guardando datos en la nube...";

      const nombre = document.getElementById('nombre').value.trim();
      const cif = document.getElementById('cif').value.trim();
      const ultimo_albaran = parseInt(document.getElementById('ultimo_albaran').value) || 0;
      const ultima_factura = parseInt(document.getElementById('ultima_factura').value) || 0;

      if (!nombre) {
        status.style.color = '#dc2626';
        status.innerText = "⚠️ Escribe al menos el nombre de la empresa.";
        return;
      }

      const { error } = await db
        .from('empresas')
        .insert([
          { 
            nombre_comercial: nombre, 
            cif_nif: cif, 
            ultimo_albaran: ultimo_albaran, 
            ultima_factura: ultima_factura 
          }
        ]);

      if (error) {
        console.error(error);
        status.style.color = '#dc2626';
        status.innerText = "❌ Error: " + error.message;
      } else {
        status.style.color = '#16a34a';
        status.innerText = "✅ ¡Empresa guardada con éxito!";
        document.getElementById('nombre').value = '';
        document.getElementById('cif').value = '';
      }
    }
  </script>
</body>
