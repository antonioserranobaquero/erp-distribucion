<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impresión de Etiquetas y Lotes - ERP Distribución</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }

    @media print {
      body * { visibility: hidden; }
      .no-print { display: none !important; }
      #seccionImpresion, #seccionImpresion * { visibility: visible; }
      #seccionImpresion {
        position: absolute;
        left: 0;
        top: 0;
        width: 100mm;
        height: 50mm;
        margin: 0;
        padding: 0;
      }
      @page {
        size: 100mm 50mm;
        margin: 0;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-6xl mx-auto space-y-6 px-4 pt-4">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
          <i class="fa-solid fa-sliders text-emerald-600"></i> Datos de la Etiqueta / Lote
        </h2>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Producto</label>
            <input type="text" id="inputBuscarProd" list="dlProds" onchange="seleccionarProductoEtiqueta()" placeholder="Escribe el producto..." class="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-semibold">
            <datalist id="dlProds"></datalist>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nº de Lote</label>
              <input type="text" id="lblLote" onkeyup="actualizarVistaEtiqueta()" value="LOT-2026-0724" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm font-mono">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha Caducidad</label>
              <input type="date" id="lblCaducidad" onchange="actualizarVistaEtiqueta()" value="2027-12-31" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Peso Neto (kg)</label>
              <input type="number" step="0.1" id="lblPeso" onkeyup="actualizarVistaEtiqueta()" value="10.0" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cajas / Formato</label>
              <input type="text" id="lblFormato" onkeyup="actualizarVistaEtiqueta()" value="Caja 1 Ud." class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Conservación y Origen</label>
            <input type="text" id="lblOrigen" onkeyup="actualizarVistaEtiqueta()" value="Mantener congelado a -18ºC · Reg. San. 10.12345/MA" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm">
          </div>
        </div>

        <div class="pt-3 border-t flex justify-end gap-2">
          <button onclick="window.print()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-print"></i> Imprimir Pegatina Térmica
          </button>
        </div>
      </div>

      <div class="flex flex-col items-center justify-center space-y-3 bg-slate-100 p-6 rounded-2xl border border-dashed border-slate-300">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-eye mr-1"></i> Vista Previa (Formato Físico 100x50mm)</span>
        
        <div id="seccionImpresion" class="w-[380px] h-[190px] bg-white border-2 border-slate-900 p-3 rounded shadow-md flex flex-col justify-between text-black font-sans">
          <div class="border-b border-black pb-1 flex justify-between items-start">
            <div>
              <h3 class="font-black text-sm uppercase leading-tight tracking-tight" id="prevEmpresa">DISTRIBUCIONES CONGELADOS S.L.</h3>
              <p class="text-[9px] font-semibold" id="prevOrigen">Mantener congelado a -18ºC · Reg. San. 10.12345/MA</p>
            </div>
            <span class="text-[10px] font-extrabold border border-black px-1 rounded">ULTRA CONGELADO</span>
          </div>

          <div class="my-1">
            <h2 class="text-base font-black uppercase leading-none tracking-tight truncate" id="prevProducto">SELECCIONA UN PRODUCTO</h2>
            <p class="text-[10px] font-bold text-slate-700" id="prevFormato">Caja 1 Ud.</p>
          </div>

          <div class="grid grid-cols-3 gap-1 border-t border-b border-black py-1 text-[10px]">
            <div>
              <span class="block text-[8px] font-bold uppercase text-slate-600">LOTE:</span>
              <strong id="prevLote" class="font-mono text-xs">LOT-2026-0724</strong>
            </div>
            <div>
              <span class="block text-[8px] font-bold uppercase text-slate-600">CADUCIDAD:</span>
              <strong id="prevCaducidad" class="text-xs">31/12/2027</strong>
            </div>
            <div class="text-right">
              <span class="block text-[8px] font-bold uppercase text-slate-600">PESO NETO:</span>
              <strong id="prevPeso" class="text-sm font-black">10.0 kg</strong>
            </div>
          </div>

          <div class="flex justify-center items-center pt-1">
            <svg id="barcodeCanvas" class="h-10 w-full"></svg>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productosLista = [];

    window.onload = async () => {
      await cargarProductos();
      actualizarVistaEtiqueta();
    };

    async function cargarProductos() {
      const empresaId = getEmpresaIdActivo();
      let query = dbClient.from('productos').select('*');
      if (empresaId) query = query.eq('empresa_id', empresaId);

      const { data } = await query.order('nombre');
      productosLista = data || [];

      const dl = document.getElementById('dlProds');
      dl.innerHTML = productosLista.map(p => `<option value="${p.nombre || p.nombre_producto}"></option>`).join('');

      if (productosLista.length > 0) {
        document.getElementById('inputBuscarProd').value = productosLista[0].nombre || productosLista[0].nombre_producto;
        seleccionarProductoEtiqueta();
      }
    }

    function seleccionarProductoEtiqueta() {
      const nombreInput = document.getElementById('inputBuscarProd').value;
      const prod = productosLista.find(p => (p.nombre || p.nombre_producto || '').toLowerCase() === nombreInput.toLowerCase());

      if (prod) {
        document.getElementById('prevProducto').innerText = prod.nombre || prod.nombre_producto;
      } else {
        document.getElementById('prevProducto').innerText = nombreInput.toUpperCase() || 'PRODUCTO';
      }
      actualizarVistaEtiqueta();
    }

    function actualizarVistaEtiqueta() {
      const lote = document.getElementById('lblLote').value || 'S/L';
      const cad = document.getElementById('lblCaducidad').value;
      const peso = document.getElementById('lblPeso').value || '0.0';
      const formato = document.getElementById('lblFormato').value || '';
      const origen = document.getElementById('lblOrigen').value || '';

      document.getElementById('prevLote').innerText = lote;
      document.getElementById('prevCaducidad').innerText = cad ? cad.split('-').reverse().join('/') : '--/--/----';
      document.getElementById('prevPeso').innerText = `${parseFloat(peso).toFixed(1)} kg`;
      document.getElementById('prevFormato').innerText = formato;
      document.getElementById('prevOrigen').innerText = origen;

      try {
        JsBarcode("#barcodeCanvas", lote, {
          format: "CODE128",
          lineColor: "#000",
          width: 1.8,
          height: 32,
          displayValue: false
        });
      } catch (e) {
        console.log("Error generando código de barras:", e);
      }
    }
  </script>
</body>
</html>
