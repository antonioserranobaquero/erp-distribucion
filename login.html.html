<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - ERP Distribución</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
    
    <!-- CABECERA -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-blue-600/10 border border-blue-500/20 text-blue-400 rounded-2xl mb-1">
        <i class="fa-solid fa-snowflake text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-wide uppercase">ERP CONGELADOS</h1>
      <p class="text-xs text-slate-400 font-semibold">Acceso Privado a la Plataforma de Gestión Integral</p>
    </div>

    <!-- PESTAÑAS LOGIN / REGISTRO -->
    <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
      <button id="tabLogin" type="button" onclick="cambiarPestana('login')" class="flex-1 py-2 rounded-lg text-white bg-blue-600 transition">Iniciar Sesión</button>
      <button id="tabRegister" type="button" onclick="cambiarPestana('register')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Crear Cuenta</button>
    </div>

    <!-- FORMULARIO 1: INICIAR SESIÓN -->
    <form id="formLogin" onsubmit="ejecutarLogin(event)" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Correo Electrónico</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400 font-semibold pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked class="rounded bg-slate-950 border-slate-800 text-blue-600 focus:ring-0">
          <span>Recordarme</span>
        </label>
        <a href="#" onclick="alert('Contacta con el Superadministrador para restablecer tu clave.')" class="text-blue-400 hover:underline">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" id="btnLogin" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl shadow-lg shadow-blue-600/20 text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
      </button>
    </form>

    <!-- FORMULARIO 2: REGISTRO AUTÓNOMO -->
    <form id="formRegister" onsubmit="ejecutarRegistro(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nombre Comercial de la Empresa</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-building"></i>
          </span>
          <input type="text" id="regEmpresa" required placeholder="Ej: Mariscos del Sur S.L." class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nombre del Administrador</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="regNombre" required placeholder="Ej: Juan Pérez" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Correo Electrónico</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="regEmail" required placeholder="correo@empresa.com" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-key"></i>
          </span>
          <input type="password" id="regPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <button type="submit" id="btnRegister" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl shadow-lg shadow-emerald-600/20 text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Crear Cuenta y Empresa
      </button>
    </form>

    <!-- ALERTA DINÁMICA -->
    <div id="alertaBox" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>

    <div class="text-center pt-2">
      <span class="text-[10px] text-slate-600 font-bold uppercase">ERP SaaS v17 • Aislamiento RLS Protegido</span>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function cambiarPestana(tab) {
      const fLogin = document.getElementById('formLogin');
      const fReg = document.getElementById('formRegister');
      const tLogin = document.getElementById('tabLogin');
      const tReg = document.getElementById('tabRegister');
      const alerta = document.getElementById('alertaBox');

      alerta.classList.add('hidden');

      if (tab === 'login') {
        fLogin.classList.remove('hidden');
        fReg.classList.add('hidden');
        tLogin.className = "flex-1 py-2 rounded-lg text-white bg-blue-600 transition";
        tReg.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
      } else {
        fLogin.classList.add('hidden');
        fReg.classList.remove('hidden');
        tReg.className = "flex-1 py-2 rounded-lg text-white bg-emerald-600 transition";
        tLogin.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
      }
    }

    async function ejecutarLogin(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const alerta = document.getElementById('alertaBox');
      const btn = document.getElementById('btnLogin');

      alerta.classList.add('hidden');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
      btn.disabled = true;

      try {
        const { data: usuarios, error } = await dbClient.from('usuarios').select('*');
        if (error) throw new Error("Error al consultar usuarios: " + error.message);

        const u = (usuarios || []).find(x => 
          (x.email && x.email.trim().toLowerCase() === emailInput) ||
          (x.correo && x.correo.trim().toLowerCase() === emailInput)
        );

        if (u) {
          const passBD = u.password || u.contrasena || u.clave;
          
          if (String(passBD) === passwordInput) {
            let nombreEmpresa = 'Mi Empresa';
            if (u.empresa_id) {
              const { data: emp } = await dbClient.from('empresas').select('nombre_comercial, nombre').eq('id', u.empresa_id).maybeSingle();
              if (emp) nombreEmpresa = emp.nombre_comercial || emp.nombre;
            }

            const esSuperAdmin = u.rol === 'SUPERADMIN';

            const sesionData = {
              id: u.id,
              nombre: u.nombre || 'Usuario',
              email: u.email || u.correo,
              rol: u.rol || 'ADMIN',
              es_superadmin: esSuperAdmin,
              modo_inspeccion: esSuperAdmin,
              empresa_id: u.empresa_id,
              empresa_nombre: nombreEmpresa,
              es_demo: u.es_demo || false,
              tutorial_visto: u.tutorial_visto || false
            };

            const jsonSesion = JSON.stringify(sesionData);

            localStorage.setItem('erp_usuario_sesion', jsonSesion);
            localStorage.setItem('usuario_sesion', jsonSesion);
            localStorage.setItem('user_session', jsonSesion);
            localStorage.setItem('sesion', jsonSesion);
            if (u.empresa_id) {
              localStorage.setItem('empresa_id_activo', u.empresa_id);
            }

            window.location.href = "index.html";
            return;
          }
        }

        alerta.className = "p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs font-bold text-center";
        alerta.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i> Correo o contraseña incorrectos.';
        alerta.classList.remove('hidden');

      } catch (err) {
        alerta.className = "p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs font-bold text-center";
        alerta.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ${err.message}`;
        alerta.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión';
        btn.disabled = false;
      }
    }

    async function ejecutarRegistro(e) {
      e.preventDefault();
      
      const nombreEmpresa = document.getElementById('regEmpresa').value.trim();
      const nombreUser = document.getElementById('regNombre').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const pass = document.getElementById('regPassword').value.trim();
      const btn = document.getElementById('btnRegister');
      const alerta = document.getElementById('alertaBox');

      alerta.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando usuario y empresa...';

      try {
        const { data: usuariosExistentes, error: errCheck } = await dbClient.from('usuarios').select('email');
        if (errCheck) throw errCheck;

        const existe = (usuariosExistentes || []).some(x => (x.email || '').toLowerCase() === email);
        if (existe) {
          throw new Error('Ese correo electrónico ya está registrado.');
        }

        const nuevaEmpresaId = crypto.randomUUID();
        const cifGenerado = 'B' + Math.floor(10000000 + Math.random() * 90000000);

        const { error: errorEmpresa } = await dbClient.from('empresas').insert([{
          id: nuevaEmpresaId,
          nombre: nombreEmpresa,
          nombre_comercial: nombreEmpresa,
          cif: cifGenerado
        }]);

        if (errorEmpresa) throw new Error("Error al crear la empresa: " + errorEmpresa.message);

        const nuevoUsuarioId = crypto.randomUUID();
        const { error: errorUsuario } = await dbClient.from('usuarios').insert([{
          id: nuevoUsuarioId,
          empresa_id: nuevaEmpresaId,
          nombre: nombreUser,
          email: email,
          password: pass,
          rol: 'ADMIN',
          es_demo: false,
          tutorial_visto: false
        }]);

        if (errorUsuario) throw new Error("Error al crear el usuario: " + errorUsuario.message);

        const sesionData = {
          id: nuevoUsuarioId,
          nombre: nombreUser,
          email: email,
          rol: 'ADMIN',
          es_superadmin: false,
          modo_inspeccion: false,
          empresa_id: nuevaEmpresaId,
          empresa_nombre: nombreEmpresa,
          es_demo: false,
          tutorial_visto: false
        };

        const jsonSesion = JSON.stringify(sesionData);
        localStorage.setItem('erp_usuario_sesion', jsonSesion);
        localStorage.setItem('usuario_sesion', jsonSesion);
        localStorage.setItem('user_session', jsonSesion);
        localStorage.setItem('sesion', jsonSesion);
        localStorage.setItem('empresa_id_activo', nuevaEmpresaId);

        window.location.href = "index.html";

      } catch (err) {
        alerta.className = "p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs font-bold text-center";
        alerta.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> ' + err.message;
        alerta.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Crear Cuenta y Empresa';
      }
    }
  </script>
</body>
</html>
