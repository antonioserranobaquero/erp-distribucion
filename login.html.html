<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - ERP Distribución</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
    
    <!-- CABECERA DE LOGIN -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-blue-600/10 border border-blue-500/20 text-blue-400 rounded-2xl mb-2">
        <i class="fa-solid fa-snowflake text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-wide uppercase">ERP Congelados</h1>
      <p class="text-xs text-slate-400 font-semibold">Acceso Privado a la Plataforma de Gestión Integral</p>
    </div>

    <!-- FORMULARIO DE ACCESO -->
    <form onsubmit="ejecutarLogin(event)" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Correo Electrónico</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="loginEmail" required value="admin@admin.com" placeholder="correo@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-xs">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="loginPassword" required value="AdminSeguro2026!" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl pl-9 pr-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400 font-semibold pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked class="rounded bg-slate-950 border-slate-800 text-blue-600 focus:ring-0">
          <span>Recordarme</span>
        </label>
        <a href="#" onclick="alert('Contacta con el Superadministrador para restablecer tu clave.')" class="text-blue-400 hover:underline">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" id="btnLogin" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl shadow-lg shadow-blue-600/20 text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
      </button>
    </form>

    <!-- ALERTA DE ERROR -->
    <div id="loginError" class="hidden p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl text-xs font-bold text-center">
      <i class="fa-solid fa-circle-xmark mr-1"></i> Correo o contraseña incorrectos.
    </div>

    <div class="text-center pt-2">
      <span class="text-[10px] text-slate-600 font-bold uppercase">ERP SaaS v17 • Aislamiento RLS Protegido</span>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function ejecutarLogin(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('btnLogin');

      errorDiv.classList.add('hidden');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
      btn.disabled = true;

      try {
        // Consultar la tabla 'usuarios'
        const { data: usuarios, error } = await dbClient
          .from('usuarios')
          .select('*');

        if (error) {
          throw new Error("Error en la base de datos: " + error.message);
        }

        // Búsqueda flexible de email
        const usuarioEncontrado = (usuarios || []).find(u => 
          (u.email && u.email.trim().toLowerCase() === emailInput) ||
          (u.correo && u.correo.trim().toLowerCase() === emailInput)
        );

        if (usuarioEncontrado) {
          const passBD = usuarioEncontrado.password || usuarioEncontrado.contrasena || usuarioEncontrado.clave;
          
          if (String(passBD) === passwordInput) {
            // Guardar sesión en localStorage
            const sesionData = {
              id: usuarioEncontrado.id,
              nombre: usuarioEncontrado.nombre || 'Administrador',
              email: usuarioEncontrado.email || usuarioEncontrado.correo,
              rol: usuarioEncontrado.rol || 'ADMIN',
              empresa_id: usuarioEncontrado.empresa_id || '00000000-0000-0000-0000-000000000001'
            };

            localStorage.setItem('erp_usuario_sesion', JSON.stringify(sesionData));
            localStorage.setItem('empresa_id_activo', sesionData.empresa_id);

            // Redirigir al inicio del sistema
            window.location.href = "index.html";
            return;
          }
        }

        // Si falla la validación
        errorDiv.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i> Correo o contraseña incorrectos.';
        errorDiv.classList.remove('hidden');

      } catch (err) {
        errorDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ${err.message}`;
        errorDiv.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
