<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - ERP Distribución</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-8 space-y-6">
    
    <!-- CABECERA Y LOGO -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-3xl mb-1">
        ❄️
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-wide">ERP CONGELADOS</h1>
      <p class="text-xs text-slate-400">Acceso Privado a la Plataforma de Gestión Integral</p>
    </div>

    <!-- FORMULARIO DE ACCESO -->
    <form id="loginForm" onsubmit="iniciarSesion(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Correo Electrónico</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-envelope text-sm"></i>
          </span>
          <input type="email" id="email" required placeholder="usuario@empresa.com" class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm font-semibold text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm font-semibold text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
          <input type="checkbox" id="rememberMe" checked class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-blue-500">
          <span>Recordarme</span>
        </label>
        <a href="#" onclick="alert('Contacta con el administrador del sistema para restablecer tu acceso.')" class="text-blue-400 hover:underline font-semibold">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
      </button>

      <!-- MENSAJES DE ESTADO -->
      <div id="statusMsg" class="hidden text-center text-xs font-bold p-3 rounded-xl"></div>

    </form>

    <!-- PIE DE PÁGINA -->
    <div class="pt-4 border-t border-slate-800 text-center">
      <span class="text-[10px] text-slate-500 font-mono">ERP SaaS v17 • Aislamiento RLS Protegido</span>
    </div>

  </div>

  <!-- SCRIPT DE AUTENTICACIÓN Y REDIRECCIÓN DE ROLES -->
  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Verificar si ya hay sesión activa al cargar y redirigir automáticamente por rol
    window.onload = async () => {
      const { data: { session } } = await dbClient.auth.getSession();
      if (session && session.user) {
        await redirigirPorRol(session.user.email);
      }
    };

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const statusMsg = document.getElementById('statusMsg');
      const btnSubmit = document.getElementById('btnSubmit');

      statusMsg.className = "text-center text-xs font-bold p-3 rounded-xl bg-blue-900/40 text-blue-300 border border-blue-800 block";
      statusMsg.innerText = "⏳ Verificando credenciales...";
      btnSubmit.disabled = true;

      const { data, error } = await dbClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        statusMsg.className = "text-center text-xs font-bold p-3 rounded-xl bg-rose-900/40 text-rose-300 border border-rose-800 block";
        statusMsg.innerText = "❌ Error: " + (error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : error.message);
        btnSubmit.disabled = false;
      } else {
        statusMsg.className = "text-center text-xs font-bold p-3 rounded-xl bg-emerald-900/40 text-emerald-300 border border-emerald-800 block";
        statusMsg.innerText = "✅ Credenciales válidas. Redirigiendo según tu perfil...";
        
        await redirigirPorRol(email);
      }
    }

    // Lógica de redirección transparente según el perfil registrado
    async function redirigirPorRol(email) {
      const { data: usrData } = await dbClient
        .from('usuarios')
        .select('rol')
        .eq('email', email)
        .maybeSingle();

      const rol = usrData ? usrData.rol : 'ADMIN';

      setTimeout(() => {
        if (rol === 'SUPERADMIN') {
          window.location.href = "superadmin_dashboard.html";
        } else if (rol === 'REPARTIDOR') {
          window.location.href = "repartidor.html";
        } else {
          window.location.href = "index.html";
        }
      }, 600);
    }
  </script>
</body>
</html>
