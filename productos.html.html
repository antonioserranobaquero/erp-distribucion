<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos - ERP Distribución</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client & Auth Guard -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-7xl mx-auto space-y-6 px-4 pt-4">

    <!-- FORMULARIO AÑADIR PRODUCTO -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="text-xs font-black uppercase text-slate-800 tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-square-plus text-emerald-600 text-sm"></i> Añadir Producto al Catálogo
      </h2>

      <form onsubmit="guardarProducto(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Nombre del Producto</label>
          <input type="text" id="pNombre" required placeholder="Ej: Calamar 20/30" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Código / Ref.</label>
          <input type="text" id="pCodigo" placeholder="Ej: CAL-01" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Precio Venta (€ / KG)</label>
          <input type="number" step="0.01" id="pPrecio" required placeholder="12.50" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Categoría</label>
          <input type="text" id="pCategoria" placeholder="Ej: Pescado / Marisco" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
        </div>

        <div class="md:col-span-4 flex justify-end pt-2">
          <button type="submit" id="btnGuardarProd" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow transition flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Guardar Producto en Catálogo
          </button>
        </div>
      </form>
    </div>

    <!-- BARRA DE BÚSQUEDA Y CONTADOR -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="relative w-full md:w-96">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-xs">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" id="inputBuscarProd" oninput="filtrarProductos()" placeholder="Buscar producto o ref..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
      </div>

      <div id="statTotalArticulos" class="px-4 py-1.5 bg-blue-50 text-blue-700 rounded-xl text-xs font-bold border border-blue-100">
        0 Artículos
      </div>
    </div>

    <!-- TABLA PRODUCTOS -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-500 uppercase text-[10px] font-bold border-b">
            <tr>
              <th class="p-3">Ref</th>
              <th class="p-3">Producto</th>
              <th class="p-3">Categoría</th>
              <th class="p-3 text-right">Precio (€/KG)</th>
              <th class="p-3 text-center">Stock Cajas</th>
              <th class="p-3 text-center">Stock (KG)</th>
              <th class="p-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductosBody" class="divide-y divide-slate-100 font-semibold text-slate-700">
            <tr><td colspan="7" class="p-6 text-center text-slate-400">Cargando catálogo de productos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productosLista = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await cargarProductos();
    });

    async function cargarProductos() {
      const empresaIdActiva = (typeof getEmpresaIdActivo === 'function' ? getEmpresaIdActivo() : null) || '473e56d8-be5d-441d-bbbf-9a6010f35443';

      // 1. Intentar consulta filtrando por empresa_id
      let { data: productos, error } = await db
        .from('productos')
        .select('*')
        .eq('empresa_id', empresaIdActiva)
        .order('created_at', { ascending: false });

      // 2. Fallback amplio si viene vacío
      if (!productos || productos.length === 0) {
        console.warn("Búsqueda primaria sin resultados, realizando fallback de productos...");
        const resAll = await db.from('productos').select('*').order('created_at', { ascending: false });
        if (resAll.data && resAll.data.length > 0) {
          productos = resAll.data.filter(p => 
            !p.empresa_id || 
            String(p.empresa_id).trim().toLowerCase() === String(empresaIdActiva).trim().toLowerCase()
          );
          if (productos.length === 0) productos = resAll.data;
        }
      }

      productosLista = productos || [];
      renderizarProductos(productosLista);
    }

    function renderizarProductos(lista) {
      const tbody = document.getElementById('tablaProductosBody');
      tbody.innerHTML = '';

      if (!lista || lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">No hay artículos registrados para esta empresa.</td></tr>';
        document.getElementById('statTotalArticulos').innerText = '0 Artículos';
        return;
      }

      lista.forEach(p => {
        const ref = p.codigo || p.referencia || p.ref || `PROD-${p.id}`;
        const nombre = p.nombre || p.nombre_producto || p.descripcion || 'Producto sin nombre';
        const categoria = p.categoria || p.familia || 'General';
        const precio = Number(p.precio_kg || p.precio_venta || p.precio || 0);
        const cajas = Number(p.stock_cajas || p.cajas || 0);
        const kilos = Number(p.kilos_stock || p.stock_kilos || p.stock || 0);

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono text-slate-400 text-[11px] font-bold">${ref}</td>
            <td class="p-3 font-bold text-slate-900">${nombre}</td>
            <td class="p-3 text-slate-600"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold">${categoria}</span></td>
            <td class="p-3 text-right font-mono font-bold text-emerald-700">${precio.toFixed(2)} €</td>
            <td class="p-3 text-center font-mono font-bold text-slate-700">${cajas}</td>
            <td class="p-3 text-center font-mono font-bold ${kilos < 20 ? 'text-rose-600' : 'text-slate-900'}">${kilos.toFixed(2)} kg</td>
            <td class="p-3 text-center">
              <button onclick="eliminarProducto('${p.id}')" class="text-slate-400 hover:text-rose-600 p-1 transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });

      document.getElementById('statTotalArticulos').innerText = `${lista.length} Artículos`;
    }

    function filtrarProductos() {
      const q = document.getElementById('inputBuscarProd').value.toLowerCase().trim();
      const filtrados = productosLista.filter(p => {
        const nom = (p.nombre || p.nombre_producto || '').toLowerCase();
        const ref = (p.codigo || p.referencia || '').toLowerCase();
        const cat = (p.categoria || '').toLowerCase();
        return nom.includes(q) || ref.includes(q) || cat.includes(q);
      });
      renderizarProductos(filtrados);
    }

    async function guardarProducto(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardarProd');
      const empresaIdActiva = (typeof getEmpresaIdActivo === 'function' ? getEmpresaIdActivo() : null) || '473e56d8-be5d-441d-bbbf-9a6010f35443';

      const nuevoProd = {
        nombre: document.getElementById('pNombre').value.trim(),
        codigo: document.getElementById('pCodigo').value.trim() || null,
        precio_kg: parseFloat(document.getElementById('pPrecio').value) || 0,
        categoria: document.getElementById('pCategoria').value.trim() || 'General',
        empresa_id: empresaIdActiva
      };

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';

      const { error } = await db.from('productos').insert([nuevoProd]);

      if (error) {
        alert("Error al guardar producto: " + error.message);
      } else {
        document.getElementById('pNombre').value = '';
        document.getElementById('pCodigo').value = '';
        document.getElementById('pPrecio').value = '';
        document.getElementById('pCategoria').value = '';
        await cargarProductos();
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-plus"></i> Guardar Producto en Catálogo';
    }

    async function eliminarProducto(id) {
      if (!confirm("¿Seguro que deseas eliminar este producto del catálogo?")) return;
      
      const { error } = await db.from('productos').delete().eq('id', id);
      if (error) {
        alert("Error al eliminar: " + error.message);
      } else {
        await cargarProductos();
      }
    }
  </script>
</body>
</html>
