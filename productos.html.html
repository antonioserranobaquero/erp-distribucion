<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos - ERP Distribución</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-6xl mx-auto space-y-6 px-4 pt-4">

    <!-- FORMULARIO CREAR PRODUCTO -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-square-plus text-emerald-600"></i> Añadir Producto al Catálogo
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre del Producto</label>
          <input type="text" id="addNombre" placeholder="Ej: Calamar 20/30" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Código / Ref.</label>
          <input type="text" id="addCodigo" placeholder="Ej: CAL-01" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Precio Venta (€ / kg)</label>
          <input type="number" step="0.01" id="addPrecio" placeholder="12.50" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoría</label>
          <input type="text" id="addCategoria" placeholder="Ej: Pescado / Marisco" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="flex justify-end">
        <button onclick="guardarNuevoProducto()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Guardar Producto en Catálogo
        </button>
      </div>
    </div>

    <!-- BUSCADOR Y TABLA -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="inputBuscarCatalog" onkeyup="filtrarCatalogo()" placeholder="Buscar producto o ref..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <span id="contadorProductos" class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-bold">0 Artículos</span>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-xs text-slate-500 uppercase border-b">
            <tr>
              <th class="p-3">Ref</th>
              <th class="p-3">Producto</th>
              <th class="p-3">Categoría</th>
              <th class="p-3 text-right">Precio (€/kg)</th>
              <th class="p-3 text-right">Stock Cajas</th>
              <th class="p-3 text-right">Stock (kg)</th>
              <th class="p-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCatalogo" class="divide-y divide-slate-100">
            <tr><td colspan="7" class="p-6 text-center text-slate-400">Cargando catálogo...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL EDITAR PRODUCTO -->
  <div id="modalEditar" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-600"></i> Editar Producto
        </h3>
        <button onclick="cerrarModalEditar()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <input type="hidden" id="editId">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre del Producto</label>
          <input type="text" id="editNombre" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Código / Ref</label>
            <input type="text" id="editCodigo" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Categoría</label>
            <input type="text" id="editCategoria" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Precio (€/kg)</label>
            <input type="number" step="0.01" id="editPrecio" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Stock Cajas</label>
            <input type="number" id="editCajas" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Stock Kilos</label>
            <input type="number" step="0.1" id="editKilos" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800">
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 border-t pt-4">
        <button onclick="cerrarModalEditar()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200">Cancelar</button>
        <button onclick="guardarCambiosProducto()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow">
          💾 Guardar Cambios
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S1O3tX2mNv09PVH-WuSopA_mUEaz7U_";
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let productosCatalogo = [];

    window.onload = async () => {
      await cargarCatalogo();
    };

    async function cargarCatalogo() {
      const empresaId = getEmpresaIdActivo();
      let query = dbClient.from('productos').select('*');
      if (empresaId) query = query.eq('empresa_id', empresaId);

      const { data, error } = await query.order('nombre');

      if (error) {
        console.error(error);
        return alert("Error al cargar productos.");
      }

      productosCatalogo = data || [];
      document.getElementById('contadorProductos').innerText = `${productosCatalogo.length} Artículos`;
      renderizarTabla(productosCatalogo);
    }

    function renderizarTabla(lista) {
      const tbody = document.getElementById('tablaCatalogo');
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">No hay artículos registrados para esta empresa.</td></tr>';
        return;
      }

      tbody.innerHTML = lista.map(p => {
        const precio = parseFloat(p.precio_venta || p.precio_base || p.precio || 0).toFixed(2);
        const kilos = parseFloat(p.kilos_stock || p.stock_kilos || 0).toFixed(2);
        const cajas = p.cajas_stock || p.stock_cajas || 0;
        const nom = p.nombre || p.nombre_producto;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono font-bold text-slate-600">${p.codigo || '-'}</td>
            <td class="p-3 font-bold text-slate-900">${nom}</td>
            <td class="p-3 text-slate-500">${p.categoria || 'Congelado'}</td>
            <td class="p-3 text-right font-bold text-blue-600">${precio} €</td>
            <td class="p-3 text-right font-semibold text-slate-700">${cajas}</td>
            <td class="p-3 text-right font-bold ${parseFloat(kilos) <= 20 ? 'text-rose-600' : 'text-slate-800'}">${kilos} kg</td>
            <td class="p-3 text-center">
              <button onclick="abrirModalEditar('${p.id}')" class="px-3 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold text-xs transition border border-blue-200">
                <i class="fa-solid fa-pen-to-square"></i> Editar
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filtrarCatalogo() {
      const q = document.getElementById('inputBuscarCatalog').value.toLowerCase();
      const filtrados = productosCatalogo.filter(p => {
        const nom = (p.nombre || p.nombre_producto || '').toLowerCase();
        const cod = (p.codigo || '').toLowerCase();
        return nom.includes(q) || cod.includes(q);
      });
      renderizarTabla(filtrados);
    }

    async function guardarNuevoProducto() {
      const nombre = document.getElementById('addNombre').value.trim();
      const codigo = document.getElementById('addCodigo').value.trim();
      const precio = parseFloat(document.getElementById('addPrecio').value) || 0;
      const categoria = document.getElementById('addCategoria').value.trim() || 'Pescado Congelado';
      const empresaId = getEmpresaIdActivo();

      if (!nombre) return alert("Escribe el nombre del producto.");

      const { error } = await dbClient.from('productos').insert([{
        empresa_id: empresaId,
        nombre: nombre,
        codigo: codigo || `PROD-${Math.floor(100 + Math.random() * 900)}`,
        precio_venta: precio,
        categoria: categoria,
        kilos_stock: 0,
        cajas_stock: 0,
        stock_kilos: 0,
        stock_cajas: 0
      }]);

      if (error) return alert("Error al guardar: " + error.message);

      document.getElementById('addNombre').value = "";
      document.getElementById('addCodigo').value = "";
      document.getElementById('addPrecio').value = "";
      document.getElementById('addCategoria').value = "";

      await cargarCatalogo();
    }

    function abrirModalEditar(id) {
      const p = productosCatalogo.find(item => String(item.id) === String(id));
      if (!p) return;

      document.getElementById('editId').value = p.id;
      document.getElementById('editNombre').value = p.nombre || p.nombre_producto || '';
      document.getElementById('editCodigo').value = p.codigo || '';
      document.getElementById('editCategoria').value = p.categoria || '';
      document.getElementById('editPrecio').value = p.precio_venta || p.precio_base || 0;
      document.getElementById('editCajas').value = p.cajas_stock || p.stock_cajas || 0;
      document.getElementById('editKilos').value = p.kilos_stock || p.stock_kilos || 0;

      document.getElementById('modalEditar').classList.remove('hidden');
      document.getElementById('modalEditar').classList.add('flex');
    }

    function cerrarModalEditar() {
      document.getElementById('modalEditar').classList.add('hidden');
      document.getElementById('modalEditar').classList.remove('flex');
    }

    async function guardarCambiosProducto() {
      const id = document.getElementById('editId').value;
      const nombre = document.getElementById('editNombre').value.trim();
      const codigo = document.getElementById('editCodigo').value.trim();
      const categoria = document.getElementById('editCategoria').value.trim();
      const precio = parseFloat(document.getElementById('editPrecio').value) || 0;
      const cajas = parseInt(document.getElementById('editCajas').value) || 0;
      const kilos = parseFloat(document.getElementById('editKilos').value) || 0;

      if (!nombre) return alert("El nombre no puede estar vacío.");

      const { error } = await dbClient
        .from('productos')
        .update({
          nombre: nombre,
          codigo: codigo,
          categoria: categoria,
          precio_venta: precio,
          cajas_stock: cajas,
          kilos_stock: kilos,
          stock_cajas: cajas,
          stock_kilos: kilos
        })
        .eq('id', id);

      if (error) return alert("Error al actualizar: " + error.message);

      cerrarModalEditar();
      await cargarCatalogo();
    }
  </script>
</body>
</html>
