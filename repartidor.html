<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Repartidor - ERP Distribución</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Signature Pad JS para firma digital táctil -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <style>
    body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: #f8fafc; }
    canvas { touch-action: none; }
    
    /* Adaptar el calendario desplegable al modo oscuro */
    input[type="date"] {
      color-scheme: dark;
      cursor: pointer;
    }
  </style>
</head>
<body class="p-3 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <!-- CABECERA MÓVIL REPARTIDOR -->
  <div class="space-y-3">
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-blue-600 text-white rounded-xl text-lg">
          <i class="fa-solid fa-truck-ramp-box"></i>
        </div>
        <div>
          <h1 class="font-black text-base leading-none text-white">MODO REPARTIDOR</h1>
          <p class="text-[11px] text-slate-400 mt-1">Ruta Frigorífica Hoy</p>
        </div>
      </div>
      <a href="index.html" class="p-2 bg-slate-700 text-slate-300 rounded-xl hover:bg-slate-600 text-xs font-bold">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>

    <!-- SELECCIÓN DE FECHA CON APERTURA DE CALENDARIO EN CUALQUIER TOQUE -->
    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between text-xs cursor-pointer" onclick="document.getElementById('fechaMobile').showPicker()">
      <label class="font-bold text-slate-300 flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-calendar-days text-blue-400"></i> Fecha:
      </label>
      <input type="date" id="fechaMobile" onclick="this.showPicker()" onchange="cargarEntregasMovil()" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-white font-bold text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- RESUMEN RÁPIDO PARADAS -->
    <div class="grid grid-cols-2 gap-2 text-center text-xs">
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
        <span class="text-slate-400 block uppercase font-bold text-[10px]">Pendientes</span>
        <span id="txtPendientes" class="text-xl font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
        <span class="text-slate-400 block uppercase font-bold text-[10px]">Entregados</span>
        <span id="txtCompletados" class="text-xl font-black text-emerald-400">0</span>
      </div>
    </div>

    <!-- LISTA DE PARADAS DEL DÍA -->
    <div class="space-y-2 mt-2">
      <h2 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Paradas del Día:</h2>
      <div id="listaParadas" class="space-y-2">
        <div class="p-6 text-center text-slate-500 text-xs bg-slate-800/50 rounded-2xl border border-slate-800">
          Cargando entregas...
        </div>
      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <div class="text-center text-[10px] text-slate-500 py-4">
    ERP Distribución Frigorífica · Versión Móvil Reparto
  </div>

  <!-- MODAL FIRMA DIGITAL TÁCTIL -->
  <div id="modalFirma" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div>
          <h3 class="font-bold text-white text-sm" id="firmaClienteNombre">Cliente</h3>
          <p class="text-[11px] text-slate-400" id="firmaNumAlbaran">ALB-0000</p>
        </div>
        <button onclick="cerrarModalFirma()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- CANVAS FIRMA -->
      <div class="space-y-1">
        <label class="block text-[10px] font-bold uppercase text-slate-400">Firma del Cliente en pantalla:</label>
        <div class="bg-white rounded-2xl overflow-hidden border border-slate-700">
          <canvas id="canvasFirma" class="w-full h-40"></canvas>
        </div>
      </div>

      <!-- INCIDENCIA / NOTA REPARTIDOR -->
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Observaciones / Incidencia (opcional):</label>
        <textarea id="txtObservacionesFirma" rows="2" placeholder="Ej: Faltó 1 caja de calamar por rotura..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <!-- BOTONES ACCIÓN FIRMA -->
      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="limpiarFirma()" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700">
          <i class="fa-solid fa-eraser mr-1"></i> Borrar
        </button>
        <button onclick="confirmarEntregaConFirma()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg">
          <i class="fa-solid fa-check mr-1"></i> Confirmar
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT SUPABASE & FIRMA DIGITAL -->
  <script>
    const SUPABASE_URL = "https://cybzltwxpwezawfnklgd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5YnpsdHd4cHdlemF3Zm5rbGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjcxMjYsImV4cCI6MjEwMDMwMzEyNn0.Ib17m5wofSx8Z0PCUT2Q_Orx5OTtGyW7W9_EoJupmgY";
    
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let albaranesMovil = [];
    let clientesMap = {};
    let signaturePad = null;
    let albaranSeleccionadoId = null;

    window.onload = async () => {
      document.getElementById('fechaMobile').value = new Date().toISOString().split('T')[0];
      inicializarCanvasFirma();
      await cargarEntregasMovil();
    };

    function inicializarCanvasFirma() {
      const canvas = document.getElementById('canvasFirma');
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);

      signaturePad = new SignaturePad(canvas, {
        penColor: "rgb(15, 23, 42)"
      });
    }

    async function cargarEntregasMovil() {
      const fecha = document.getElementById('fechaMobile').value;

      const { data: clientes } = await dbClient.from('clientes').select('*');
      clientesMap = {};
      (clientes || []).forEach(c => clientesMap[c.id] = c);

      let { data: albaranes } = await dbClient.from('albaranes').select('*').eq('fecha', fecha);

      if (!albaranes || albaranes.length === 0) {
        const fallback = await dbClient.from('albaranes').select('*').limit(15);
        albaranes = fallback.data || [];
      }

      albaranesMovil = albaranes || [];
      renderizarParadas();
    }

    function renderizarParadas() {
      const contenedor = document.getElementById('listaParadas');
      
      let pendientes = 0;
      let completados = 0;

      if (albaranesMovil.length === 0) {
        contenedor.innerHTML = '<div class="p-6 text-center text-slate-500 text-xs bg-slate-800/50 rounded-2xl border border-slate-800">No hay entregas para la fecha seleccionada.</div>';
        document.getElementById('txtPendientes').innerText = '0';
        document.getElementById('txtCompletados').innerText = '0';
        return;
      }

      contenedor.innerHTML = albaranesMovil.map((a, index) => {
        const cliente = clientesMap[a.cliente_id] || {};
        const clienteNom = cliente.nombre_comercial || 'Cliente N/A';
        const direccion = cliente.direccion || 'Sin dirección registrada';
        const numAlb = a.numero_albaran || a.codigo_albaran || a.id.substring(0,8);
        const entregado = a.estado === 'entregado' || a.firma_digital;

        if (entregado) completados++; else pendientes++;

        return `
          <div class="p-4 bg-slate-800/90 rounded-2xl border ${entregado ? 'border-emerald-500/40' : 'border-slate-700'} space-y-3 shadow-sm">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${entregado ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                  ${entregado ? 'Entregado' : 'Pendiente Parada #' + (index + 1)}
                </span>
                <h3 class="font-bold text-white text-sm mt-1">${clienteNom}</h3>
                <p class="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
                  <i class="fa-solid fa-location-dot text-slate-500"></i> ${direccion}
                </p>
              </div>
              <span class="font-mono text-xs font-bold text-blue-400">${numAlb}</span>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-700/60 text-xs">
              <div>
                <span class="text-slate-400 text-[11px]">Total: </span>
                <span class="font-bold text-white">${parseFloat(a.total_euros || 0).toFixed(2)} €</span>
              </div>

              ${entregado ? `
                <span class="text-emerald-400 text-xs font-bold flex items-center gap-1">
                  <i class="fa-solid fa-circle-check"></i> Firmado
                </span>
              ` : `
                <button onclick="abrirModalFirma('${a.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow transition flex items-center gap-1 text-xs">
                  <i class="fa-solid fa-pen-nib"></i> Registrar Firma
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('txtPendientes').innerText = pendientes;
      document.getElementById('txtCompletados').innerText = completados;
    }

    function abrirModalFirma(albaranId) {
      albaranSeleccionadoId = albaranId;
      const alb = albaranesMovil.find(a => a.id === albaranId);
      if (!alb) return;

      const cliente = clientesMap[alb.cliente_id] || {};
      document.getElementById('firmaClienteNombre').innerText = cliente.nombre_comercial || 'Cliente';
      document.getElementById('firmaNumAlbaran').innerText = alb.numero_albaran || alb.codigo_albaran || alb.id.substring(0,8);
      document.getElementById('txtObservacionesFirma').value = "";

      document.getElementById('modalFirma').classList.remove('hidden');
      document.getElementById('modalFirma').classList.add('flex');
      
      setTimeout(() => {
        inicializarCanvasFirma();
      }, 100);
    }

    function cerrarModalFirma() {
      document.getElementById('modalFirma').classList.add('hidden');
      document.getElementById('modalFirma').classList.remove('flex');
    }

    function limpiarFirma() {
      if (signaturePad) signaturePad.clear();
    }

    async function confirmarEntregaConFirma() {
      if (signaturePad.isEmpty()) {
        return alert("Por favor, solicita la firma del cliente en el recuadro blanco.");
      }

      const firmaBase64 = signaturePad.toDataURL();
      const notas = document.getElementById('txtObservacionesFirma').value.trim();

      const { error } = await dbClient.from('albaranes').update({
        estado: 'entregado',
        firma_digital: firmaBase64,
        observaciones_entrega: notas
      }).eq('id', albaranSeleccionadoId);

      if (error) {
        alert("Error al guardar entrega: " + error.message);
        return;
      }

      cerrarModalFirma();
      await cargarEntregasMovil();
    }
  </script>
</body>
</html>
